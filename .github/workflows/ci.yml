name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  check:
    name: Typecheck, Lint, Test & Build
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://ci_user:ci_pass@localhost:5432/ci_db?sslmode=require"
      BETTER_AUTH_SECRET: "ci-secret-must-be-at-least-32-chars-long-123456"
      DEVICE_TOKEN_SECRET: "ci-device-secret-123456"
      VERIFY_ET_WEBHOOK_SECRET: "ci-test-mock-verify-webhook-secret-key-123456"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check TypeScript types
        run: npm run typecheck

      - name: Run ESLint
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Verify Drizzle migrations
        run: npm run db:generate

      - name: Build Next.js application
        run: npm run build
        env:
          DATABASE_URL: "postgresql://ci_user:ci_pass@localhost:5432/ci_db?sslmode=require"
          BETTER_AUTH_SECRET: "ci-secret-must-be-at-least-32-chars-long-123456"
          DEVICE_TOKEN_SECRET: "ci-device-secret-123456"
